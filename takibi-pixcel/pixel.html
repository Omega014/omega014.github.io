<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Takibi - Pixel Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      overflow: hidden;
      cursor: default;
      user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .tap-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 200, 150, 0.7);
      font-family: monospace;
      font-size: 14px;
      z-index: 10;
      animation: pulse 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .nav-link {
      position: fixed;
      top: 16px;
      right: 16px;
      color: rgba(255, 200, 150, 0.6);
      font-family: monospace;
      font-size: 14px;
      text-decoration: none;
      z-index: 10;
      transition: color 0.3s;
    }

    .nav-link:hover {
      color: rgba(255, 200, 150, 1);
    }
  </style>
</head>
<body>
  <a class="nav-link" href="/takibi/">realistic mode</a>
  <div class="tap-hint" id="tapHint">tap to start</div>
  <canvas id="pixelCanvas" width="192" height="144"></canvas>
  <script src="pixel.js"></script>
</body>
</html>
